apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: oficinapro
data:
  # Database
  DB_HOST: "postgres.xxxxx.rds.amazonaws.com"  # Substituir pelo endpoint real
  DB_PORT: "5432"
  DB_NAME: "oficinapro"
  DB_USER: "oficinapro_app"

  # JWT
  JWT_ISSUER: "auth-oficinapro"

  # Application
  PORT: "8080"
  ENVIRONMENT: "production"

  # Logging
  LOG_LEVEL: "info"

