apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: oficinapro
type: Opaque
stringData:
  # ⚠️ NÃO COMMITAR ESTE ARQUIVO COM VALORES REAIS!
  # Usar: kubectl create secret ou External Secrets Operator

  # JWT Secret (MESMO DO AUTH GATEWAY)
  JWT_SECRET: "CHANGE-ME-your-secret-key-min-32-chars-long"

  # Database Password
  DB_PASSWORD: "CHANGE-ME-your-db-password"
