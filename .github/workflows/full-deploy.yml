name: 🚀 Full Deployment Pipeline (CI + CD + Infra)

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Deployment mode'
        required: true
        default: 'code-only'
        type: choice
        options:
          - code-only       # Only update Lambda code
          - infra-only      # Only update infrastructure
          - full            # Update both code and infrastructure
      skip_tests:
        description: 'Skip CI tests'
        required: false
        default: false
        type: boolean
      terraform_action:
        description: 'Terraform action (when infra-only or full)'
        required: false
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

env:
  GO_VERSION: '1.23'
  TERRAFORM_VERSION: '1.5.0'
  FUNCTION_NAME: 'oficinapro-auth-function'
  AWS_REGION: 'us-east-1'

jobs:
  # ============================================================================
  # JOB 1: CI (Reusa workflow existente)
  # ============================================================================
  ci:
    name: Run CI Pipeline
    if: ${{ !inputs.skip_tests && (inputs.deploy_mode == 'code-only' || inputs.deploy_mode == 'full') }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ============================================================================
  # JOB 2: Build & Package (para code deploy)
  # ============================================================================
  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_mode == 'code-only' || inputs.deploy_mode == 'full' }}
    needs: [ci]
    # Always run if tests are skipped
    condition: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')

    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build Lambda binary
        run: |
          echo "🏗️ Building Lambda binary..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bootstrap ./cmd/lambda
          echo "📦 Binary size: $(du -h bootstrap | cut -f1)"

      - name: Create deployment package
        run: |
          zip function.zip bootstrap
          echo "📦 Package size: $(du -h function.zip | cut -f1)"

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-package-${{ github.run_number }}
          path: function.zip
          retention-days: 7
          if-no-files-found: error

      - name: Set output
        run: echo "name=lambda-deployment-package-${{ github.run_number }}" >> $GITHUB_OUTPUT

  # ============================================================================
  # JOB 3: Deploy Lambda Code
  # ============================================================================
  deploy-code:
    name: Deploy Lambda Code
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_mode == 'code-only' }}
    needs: [build]

    outputs:
      function_version: ${{ steps.deploy.outputs.version }}
      deployment_time: ${{ steps.deploy.outputs.time }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        id: deploy
        run: |
          echo "🚀 Deploying Lambda code..."
          START=$(date +%s)

          RESULT=$(aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --output json)

          END=$(date +%s)
          TIME=$((END - START))

          VERSION=$(echo "$RESULT" | jq -r '.Version')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "time=${TIME}" >> $GITHUB_OUTPUT

          echo "✅ Deployed version: $VERSION in ${TIME}s"

      - name: Wait for update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

  # ============================================================================
  # JOB 4: Terraform (Infrastructure)
  # ============================================================================
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_mode == 'infra-only' || inputs.deploy_mode == 'full' }}
    needs: [build]
    # For full mode, wait for build; for infra-only, no dependency
    condition: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}

    defaults:
      run:
        working-directory: ./OficinaPro-DevOps/auth-infra

    outputs:
      api_endpoint: ${{ steps.outputs.outputs.api_url }}
      lambda_arn: ${{ steps.outputs.outputs.lambda_arn }}

    steps:
      - name: Checkout DevOps repo
        uses: actions/checkout@v4
        with:
          repository: kbmarins/OficinaPro-DevOps
          token: ${{ secrets.GH_TOKEN || github.token }}
          path: OficinaPro-DevOps

      - name: Download Lambda package
        if: ${{ inputs.deploy_mode == 'full' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: OficinaPro-DevOps/auth-infra/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ inputs.terraform_action == 'apply' }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.terraform_action == 'apply' }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: ${{ inputs.terraform_action == 'destroy' }}
        run: terraform destroy -auto-approve

      - name: Capture Outputs
        if: ${{ inputs.terraform_action == 'apply' }}
        id: outputs
        run: |
          API_URL=$(terraform output -raw api_endpoint 2>/dev/null || echo "")
          LAMBDA_ARN=$(terraform output -raw auth_lambda_arn 2>/dev/null || echo "")

          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "lambda_arn=${LAMBDA_ARN}" >> $GITHUB_OUTPUT

          echo "✅ Infrastructure outputs:"
          echo "  API: ${API_URL}"
          echo "  Lambda: ${LAMBDA_ARN}"

  # ============================================================================
  # JOB 5: Post-Deploy Validation
  # ============================================================================
  validate:
    name: Post-Deploy Validation
    runs-on: ubuntu-latest
    needs: [deploy-code, terraform]
    if: |
      always() &&
      (needs.deploy-code.result == 'success' || needs.terraform.result == 'success')

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda Info
        run: |
          echo "📊 Lambda configuration:"
          aws lambda get-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --output json | jq '{
              FunctionName,
              Runtime,
              LastModified,
              Version,
              CodeSize,
              MemorySize,
              Timeout
            }'

      - name: Test Lambda
        run: |
          echo "🧪 Testing Lambda..."

          PAYLOAD='{
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/auth",
            "headers": {"content-type": "application/json"},
            "requestContext": {
              "http": {"method": "POST", "path": "/auth"}
            },
            "body": "{\"email\":\"admin@oficinapro.com\",\"senha\":\"senha123\"}"
          }'

          RESPONSE=$(aws lambda invoke \
            --function-name ${{ env.FUNCTION_NAME }} \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            /tmp/response.json \
            --output json)

          STATUS=$(echo "$RESPONSE" | jq -r '.StatusCode')

          if [ "$STATUS" = "200" ]; then
            echo "✅ Lambda test passed"
            cat /tmp/response.json | jq . || cat /tmp/response.json
          else
            echo "❌ Lambda test failed: $STATUS"
            exit 1
          fi

      - name: Check Logs
        run: |
          echo "📊 Recent logs:"
          aws logs tail /aws/lambda/${{ env.FUNCTION_NAME }} \
            --since 5m \
            --format short 2>/dev/null | tail -30 || echo "No logs"

          echo ""
          ERROR_COUNT=$(aws logs tail /aws/lambda/${{ env.FUNCTION_NAME }} \
            --since 5m \
            --format short 2>/dev/null | grep -i "context canceled" | wc -l || echo "0")

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "⚠️  Found $ERROR_COUNT 'context canceled' errors"
          else
            echo "✅ No 'context canceled' errors"
          fi

  # ============================================================================
  # JOB 6: Summary
  # ============================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [ci, build, deploy-code, terraform, validate]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 Full Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: \`${{ inputs.deploy_mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Skip Tests**: \`${{ inputs.skip_tests }}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.deploy_mode }}" != "code-only" ]]; then
            echo "- **Terraform**: \`${{ inputs.terraform_action }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ needs.ci.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Code | ${{ needs.deploy-code.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform | ${{ needs.terraform.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.terraform.outputs.api_endpoint }}" != "" ]]; then
            echo "## Deployment Info" >> $GITHUB_STEP_SUMMARY
            echo "- **API Endpoint**: \`${{ needs.terraform.outputs.api_endpoint }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Lambda ARN**: \`${{ needs.terraform.outputs.lambda_arn }}\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.deploy-code.outputs.function_version }}" != "" ]]; then
            echo "- **Function Version**: \`${{ needs.deploy-code.outputs.function_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Deploy Time**: ${{ needs.deploy-code.outputs.deployment_time }}s" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          FAILED_JOBS=""
          [[ "${{ needs.ci.result }}" == "failure" ]] && FAILED_JOBS="${FAILED_JOBS}CI, "
          [[ "${{ needs.build.result }}" == "failure" ]] && FAILED_JOBS="${FAILED_JOBS}Build, "
          [[ "${{ needs.deploy-code.result }}" == "failure" ]] && FAILED_JOBS="${FAILED_JOBS}Deploy, "
          [[ "${{ needs.terraform.result }}" == "failure" ]] && FAILED_JOBS="${FAILED_JOBS}Terraform, "
          [[ "${{ needs.validate.result }}" == "failure" ]] && FAILED_JOBS="${FAILED_JOBS}Validation, "

          if [ -z "$FAILED_JOBS" ]; then
            echo "✅ **All jobs completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Failed jobs**: ${FAILED_JOBS%,* }" >> $GITHUB_STEP_SUMMARY
          fi
