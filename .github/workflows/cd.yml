name: CD Pipeline

on:
  push:
    branches: [ main, feat/config-authorizer, develop ]
  workflow_dispatch:
    inputs:
      skip_validation:
        description: 'Skip post-deploy validation'
        required: false
        default: false
        type: boolean

env:
  FUNCTION_NAME: 'oficinapro-auth-function'
  AWS_REGION: 'us-east-1'

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest

    outputs:
      deployment_time: ${{ steps.deploy.outputs.deployment_time }}
      function_version: ${{ steps.deploy.outputs.function_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build binary
        run: |
          echo "🏗️ Building Lambda binary..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bootstrap ./cmd/lambda
          echo "📦 Binary size: $(du -h bootstrap | cut -f1)"

      - name: Create ZIP
        run: |
          zip function.zip bootstrap
          echo "📦 Package size: $(du -h function.zip | cut -f1)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda Code
        id: deploy
        run: |
          echo "🚀 Deploying to Lambda..."
          DEPLOY_START=$(date +%s)

          RESULT=$(aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --output json)

          DEPLOY_END=$(date +%s)
          DEPLOY_TIME=$((DEPLOY_END - DEPLOY_START))

          VERSION=$(echo "$RESULT" | jq -r '.Version')
          LAST_MODIFIED=$(echo "$RESULT" | jq -r '.LastModified')
          CODE_SIZE=$(echo "$RESULT" | jq -r '.CodeSize')

          echo "deployment_time=${DEPLOY_TIME}" >> $GITHUB_OUTPUT
          echo "function_version=${VERSION}" >> $GITHUB_OUTPUT

          echo "✅ Deployment completed:"
          echo "  Version: $VERSION"
          echo "  Last Modified: $LAST_MODIFIED"
          echo "  Code Size: $CODE_SIZE bytes"
          echo "  Deploy Time: ${DEPLOY_TIME}s"

      - name: Wait for Lambda Update
        run: |
          echo "⏳ Waiting for Lambda to update..."
          sleep 10
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} || true
          echo "✅ Lambda updated"

  validate:
    name: Post-Deploy Validation
    runs-on: ubuntu-latest
    needs: [deploy]
    if: ${{ !inputs.skip_validation }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Lambda Function
        id: test
        run: |
          echo "🧪 Testing Lambda function..."

          PAYLOAD='{
            "version": "2.0",
            "routeKey": "$default",
            "rawPath": "/auth",
            "headers": {"content-type": "application/json"},
            "requestContext": {
              "http": {"method": "POST", "path": "/auth"}
            },
            "body": "{\"email\":\"admin@oficinapro.com\",\"senha\":\"senha123\"}"
          }'

          RESPONSE=$(aws lambda invoke \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            --log-type Tail \
            /tmp/lambda-response.json \
            --output json)

          STATUS_CODE=$(echo "$RESPONSE" | jq -r '.StatusCode')

          echo "status_code=${STATUS_CODE}" >> $GITHUB_OUTPUT

          if [ "$STATUS_CODE" = "200" ]; then
            echo "✅ Lambda invoked successfully"
            cat /tmp/lambda-response.json | jq . || cat /tmp/lambda-response.json
          else
            echo "❌ Lambda invocation failed with status: $STATUS_CODE"
            exit 1
          fi

      - name: Check CloudWatch Logs
        run: |
          echo "📊 Checking recent CloudWatch logs..."

          aws logs tail /aws/lambda/${{ env.FUNCTION_NAME }} \
            --since 5m \
            --region ${{ env.AWS_REGION }} \
            --format short 2>/dev/null | tail -20 || echo "No recent logs"

          echo ""
          echo "🔍 Checking for errors..."

          ERROR_COUNT=$(aws logs tail /aws/lambda/${{ env.FUNCTION_NAME }} \
            --since 5m \
            --region ${{ env.AWS_REGION }} \
            --format short 2>/dev/null | grep -i "context canceled" | wc -l || echo "0")

          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "⚠️  Found $ERROR_COUNT 'context canceled' errors"
            echo "This may indicate metrics export issues"
          else
            echo "✅ No 'context canceled' errors found"
          fi

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, validate]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ needs.validate.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.deploy.outputs.function_version }}" != "" ]]; then
            echo "## Deployment Info" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ needs.deploy.outputs.function_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Deploy Time**: ${{ needs.deploy.outputs.deployment_time }}s" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.deploy.result }}" == "success" ]] && [[ "${{ needs.validate.result }}" == "success" || "${{ needs.validate.result }}" == "skipped" ]]; then
            echo "✅ **Deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment had issues. Check logs above.**" >> $GITHUB_STEP_SUMMARY
          fi
